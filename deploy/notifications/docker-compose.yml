# Evolution API + notifier worker stack for Dravio VPS deployment.
# Set EVOLUTION_DOMAIN in .env before starting (DNS must point to this host).

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      EVOLUTION_DOMAIN: ${EVOLUTION_DOMAIN}
    depends_on:
      - evolution-api

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_URL: https://${EVOLUTION_DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${DRAVIO_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "false"
      LOG_LEVEL: info
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_POSTGRES_USER} -d ${EVOLUTION_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data

  notifier-worker:
    build:
      context: ../..
      dockerfile: services/notifier-worker/Dockerfile
    restart: unless-stopped
    environment:
      DIRECT_URL: ${DRAVIO_DIRECT_URL}
      DATABASE_URL: ${DRAVIO_DIRECT_URL}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY}
      FAST2SMS_MODE: ${FAST2SMS_MODE:-dlt_manual}
      FAST2SMS_BASE_URL: ${FAST2SMS_BASE_URL:-}
      FAST2SMS_SENDER_ID: ${FAST2SMS_SENDER_ID:-}
      FAST2SMS_ENTITY_ID: ${FAST2SMS_ENTITY_ID:-}
      FAST2SMS_TEMPLATE_ID_LOGIN: ${FAST2SMS_TEMPLATE_ID_LOGIN:-}
      FAST2SMS_DLT_MESSAGE_TEMPLATE_LOGIN: ${FAST2SMS_DLT_MESSAGE_TEMPLATE_LOGIN:-}
      FAST2SMS_APP_NAME: ${FAST2SMS_APP_NAME:-Dravio}
      NOTIFICATION_SMS_ENABLED: ${NOTIFICATION_SMS_ENABLED:-true}
      SEND_INTERVAL_MS: ${SEND_INTERVAL_MS:-6000}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}
      WORKER_STALE_CLAIM_MS: ${WORKER_STALE_CLAIM_MS:-300000}
    depends_on:
      - evolution-api

volumes:
  caddy_data:
  caddy_config:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
